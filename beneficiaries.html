
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficiaries | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Manage Beneficiaries</h1>
            <p>Add, search and manage your saved demo beneficiaries.</p>

            <form id="beneficiary-form">
                <label for="beneficiary-name">Beneficiary Name</label>
                <input type="text" id="beneficiary-name" required>

                <label for="beneficiary-account">Account Number</label>
                <input type="text" id="beneficiary-account" required>

                <label for="beneficiary-bank">Bank Name</label>
                <input type="text" id="beneficiary-bank" required>

                <button type="submit">Add Beneficiary</button>
            </form>

            <h2>Saved Beneficiaries</h2>
            <input type="search" id="beneficiary-search"
                placeholder="Search by name, account or bank">

            <p id="beneficiary-count"></p>
            <div id="beneficiary-list"></div>

            <button type="button" id="export-beneficiaries">
                Export Beneficiaries CSV
            </button>

            <p id="message" role="status"></p>
            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("beneficiary-form");
        const list = document.getElementById("beneficiary-list");
        const search = document.getElementById("beneficiary-search");
        const count = document.getElementById("beneficiary-count");
        const message = document.getElementById("message");

        let beneficiaries = JSON.parse(
            localStorage.getItem("novaBeneficiaries") || "[]"
        );

        function saveBeneficiaries() {
            localStorage.setItem(
                "novaBeneficiaries",
                JSON.stringify(beneficiaries)
            );
        }

        function renderBeneficiaries() {
            const term = search.value.toLowerCase();

            const filtered = beneficiaries.filter(person =>
                person.name.toLowerCase().includes(term) ||
                person.account.toLowerCase().includes(term) ||
                person.bank.toLowerCase().includes(term)
            );

            count.textContent =
                `Showing ${filtered.length} of ${beneficiaries.length} beneficiaries`;

            list.innerHTML = "";

            if (filtered.length === 0) {
                list.textContent = beneficiaries.length
                    ? "No matching beneficiaries found."
                    : "No beneficiaries added yet.";
                return;
            }

            filtered.forEach(person => {
                const card = document.createElement("article");
                card.className = "beneficiary-card";

                const heading = document.createElement("h3");
                heading.textContent = person.name;

                const account = document.createElement("p");
                account.textContent = `Account: ${person.account}`;

                const bank = document.createElement("p");
                bank.textContent = `Bank: ${person.bank}`;

                const remove = document.createElement("button");
                remove.type = "button";
                remove.textContent = "Remove";

                remove.addEventListener("click", () => {
                    if (!confirm(`Remove ${person.name} from beneficiaries?`)) return;

                    beneficiaries = beneficiaries.filter(
                        item => item.id !== person.id
                    );

                    saveBeneficiaries();
                    renderBeneficiaries();
                    message.textContent = "Beneficiary removed successfully.";
                });

                card.append(heading, account, bank, remove);
                list.appendChild(card);
            });
        }

        form.addEventListener("submit", event => {
            event.preventDefault();

            const name = document.getElementById("beneficiary-name").value.trim();
            const account = document.getElementById("beneficiary-account").value.trim();
            const bank = document.getElementById("beneficiary-bank").value.trim();

            if (!name || !account || !bank) {
                message.textContent = "Please complete all fields.";
                return;
            }

            beneficiaries.push({
                id: Date.now().toString(),
                name,
                account,
                bank
            });

            saveBeneficiaries();
            form.reset();
            message.textContent = "Beneficiary added successfully.";
            renderBeneficiaries();
        });

        search.addEventListener("input", renderBeneficiaries);

        document.getElementById("export-beneficiaries").addEventListener("click", () => {
            if (beneficiaries.length === 0) {
                message.textContent = "There are no beneficiaries to export.";
                return;
            }

            const rows = [
                ["Name", "Account Number", "Bank"],
                ...beneficiaries.map(person => [
                    person.name,
                    person.account,
                    person.bank
                ])
            ];

            const csv = rows.map(row =>
                row.map(value =>
                    `"${String(value).replace(/"/g, '""')}"`
                ).join(",")
            ).join("\n");

            const url = URL.createObjectURL(
                new Blob([csv], { type: "text/csv;charset=utf-8;" })
            );

            const link = document.createElement("a");
            link.href = url;
            link.download = "nova-beneficiaries.csv";
            link.click();

            URL.revokeObjectURL(url);
            message.textContent = "Beneficiary list exported.";
        });

        renderBeneficiaries();
    </script>
</body>
</html>
