
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Transfer Money</h1>
            <p>Complete your demo fund transfer details.</p>

            <form id="transfer-form">
                <label for="recipient">Recipient Name</label>
                <input type="text" id="recipient" required>

                <label for="account">Account Number</label>
                <input type="text" id="account" minlength="8" maxlength="18"
                    pattern="[0-9]{8,18}" required>

                <label for="amount">Transfer Amount (₹)</label>
                <input type="number" id="amount" min="1" max="50000"
                    step="0.01" required>

                <p>Maximum demo transfer: ₹50,000</p>
                <p id="amount-message" role="status"></p>

                <label for="description">Description</label>
                <input type="text" id="description" maxlength="100">

                <button type="submit">Continue Transfer</button>
            </form>

            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("transfer-form");
        const amountInput = document.getElementById("amount");
        const amountMessage = document.getElementById("amount-message");
        const transferLimit = 50000;

        amountInput.addEventListener("input", () => {
            const amount = Number(amountInput.value);

            if (amount > transferLimit) {
                amountMessage.textContent = "Amount exceeds the ₹50,000 demo transfer limit.";
            } else if (amount <= 0 && amountInput.value !== "") {
                amountMessage.textContent = "Enter an amount greater than zero.";
            } else {
                amountMessage.textContent = "";
            }
        });

        form.addEventListener("submit", event => {
            event.preventDefault();

            const amount = Number(amountInput.value);

            if (!Number.isFinite(amount) || amount <= 0 || amount > transferLimit) {
                amountMessage.textContent = "Enter a valid amount up to ₹50,000.";
                return;
            }

            const transfer = {
                recipient: document.getElementById("recipient").value.trim(),
                account: document.getElementById("account").value.trim(),
                amount,
                description: document.getElementById("description").value.trim(),
                createdAt: new Date().toISOString()
            };

            if (!transfer.recipient || !/^[0-9]{8,18}$/.test(transfer.account)) {
                amountMessage.textContent = "Enter valid recipient details.";
                return;
            }

            sessionStorage.setItem("novaTransferDraft", JSON.stringify(transfer));
            window.location.href = "transfer-success.html";
        });
    </script>
</body>
</html>
