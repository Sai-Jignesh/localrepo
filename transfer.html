
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Transfer | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-container">
        <h1>Money Transfer</h1>
        <p>Transfer funds using this demo form.</p>

        <form id="transfer-form">
            <label for="recipient">Recipient Name</label>
            <input type="text" id="recipient" placeholder="Enter recipient name" required>

            <label for="account">Account Number</label>
            <input type="text" id="account" placeholder="Enter account number"
                   inputmode="numeric" pattern="[0-9]{9,18}" required>

            <label for="amount">Transfer Amount (₹)</label>
            <input type="number" id="amount" placeholder="Enter amount"
                   min="1" step="0.01" required>

            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Payment description"
                   maxlength="100">

            <button type="submit">Review Transfer</button>
        </form>

        <p id="transfer-message" role="status"></p>
        <a href="dashboard.html">Back to Dashboard</a>
    </div>

    <script>
        document.getElementById("transfer-form").addEventListener("submit", function(event) {
            event.preventDefault();

            if (!this.reportValidity()) return;

            const amount = Number(document.getElementById("amount").value);

            if (!Number.isFinite(amount) || amount <= 0) return;

            document.getElementById("transfer-message").textContent =
                "Transfer details validated. This is a demo; no money was transferred.";
        });
    </script>
</body>
</html>
