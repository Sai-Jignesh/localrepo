
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Transfer | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-container">
        <h1>Money Transfer</h1>
        <p>Enter recipient and transfer details.</p>

        <form id="transfer-form">
            <label for="recipient">Recipient Name</label>
            <input type="text" id="recipient" required>

            <label for="account">Account Number</label>
            <input type="text" id="account" pattern="[0-9]{9,18}"
                   inputmode="numeric" required>

            <label for="amount">Transfer Amount (₹)</label>
            <input type="number" id="amount" min="1" step="0.01" required>

            <label for="description">Description</label>
            <input type="text" id="description" maxlength="100">

            <button type="submit">Review Transfer</button>
        </form>

        <a href="dashboard.html">Back to Dashboard</a>
    </div>

    <script>
        document.getElementById("transfer-form").addEventListener("submit", function(event) {
            event.preventDefault();

            if (!this.reportValidity()) return;

            const transfer = {
                recipient: document.getElementById("recipient").value.trim(),
                account: document.getElementById("account").value,
                amount: Number(document.getElementById("amount").value),
                description: document.getElementById("description").value.trim()
            };

            if (!transfer.recipient || !Number.isFinite(transfer.amount) || transfer.amount <= 0) return;

            sessionStorage.setItem("novaTransferReview", JSON.stringify(transfer));
            window.location.href = "transfer-success.html";
        });
    </script>
</body>
</html>
