
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .generator-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #f5f6fa;
            border-radius: 14px;
        }
        .generator-container h1 {
            text-align: center;
            color: #101827;
        }
        .generator-container label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }
        .generator-container input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        .option {
            margin: 12px 0;
        }
        .password-output {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .password-output input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        .generator-container button {
            padding: 12px 18px;
            background: #101827;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .generate-button {
            width: 100%;
            margin-top: 20px;
        }
        #generatorMessage {
            text-align: center;
            margin-top: 15px;
            color: #167a42;
        }
        .generator-back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a17b18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="generator-container">
        <h1>Password Generator</h1>
        <p>Create a random password using your preferred settings.</p>

        <label for="passwordLength">Password Length</label>
        <input type="number" id="passwordLength" min="8" max="64" value="16">

        <div class="option">
            <input type="checkbox" id="includeUppercase" checked>
            <label for="includeUppercase">Include Uppercase Letters</label>
        </div>

        <div class="option">
            <input type="checkbox" id="includeLowercase" checked>
            <label for="includeLowercase">Include Lowercase Letters</label>
        </div>

        <div class="option">
            <input type="checkbox" id="includeNumbers" checked>
            <label for="includeNumbers">Include Numbers</label>
        </div>

        <div class="option">
            <input type="checkbox" id="includeSymbols" checked>
            <label for="includeSymbols">Include Symbols</label>
        </div>

        <button class="generate-button" id="generateButton" type="button">Generate Password</button>

        <div class="password-output">
            <input type="text" id="generatedPassword" placeholder="Your password appears here" readonly>
            <button id="copyButton" type="button">Copy</button>
        </div>

        <p id="generatorMessage" role="status" aria-live="polite"></p>
        <a href="index.html" class="generator-back">← Back to Home</a>
    </main>

    <script>
        const characterSets = {
            uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
            lowercase: "abcdefghijklmnopqrstuvwxyz",
            numbers: "0123456789",
            symbols: "!@#$%^&*()-_=+[]{}?"
        };

        function secureRandomIndex(max) {
            const values = new Uint32Array(1);
            const limit = Math.floor(0x100000000 / max) * max;

            do {
                crypto.getRandomValues(values);
            } while (values[0] >= limit);

            return values[0] % max;
        }

        function generatePassword() {
            const length = Number(document.getElementById("passwordLength").value);
            const selectedSets = [];

            if (document.getElementById("includeUppercase").checked) {
                selectedSets.push(characterSets.uppercase);
            }
            if (document.getElementById("includeLowercase").checked) {
                selectedSets.push(characterSets.lowercase);
            }
            if (document.getElementById("includeNumbers").checked) {
                selectedSets.push(characterSets.numbers);
            }
            if (document.getElementById("includeSymbols").checked) {
                selectedSets.push(characterSets.symbols);
            }

            const message = document.getElementById("generatorMessage");
            const output = document.getElementById("generatedPassword");

            if (!Number.isInteger(length) || length < 8 || length > 64) {
                message.textContent = "Choose a password length between 8 and 64.";
                output.value = "";
                return;
            }

            if (selectedSets.length === 0) {
                message.textContent = "Select at least one character type.";
                output.value = "";
                return;
            }

            let password = "";

            selectedSets.forEach(set => {
                password += set[secureRandomIndex(set.length)];
            });

            const allCharacters = selectedSets.join("");

            while (password.length < length) {
                password += allCharacters[secureRandomIndex(allCharacters.length)];
            }

            const characters = Array.from(password);

            for (let i = characters.length - 1; i > 0; i--) {
                const j = secureRandomIndex(i + 1);
                [characters[i], characters[j]] = [characters[j], characters[i]];
            }

            output.value = characters.join("");
            message.textContent = "Password generated successfully.";
        }

        document.getElementById("generateButton").addEventListener("click", generatePassword);

        document.getElementById("copyButton").addEventListener("click", async function() {
            const password = document.getElementById("generatedPassword").value;
            const message = document.getElementById("generatorMessage");

            if (!password) {
                message.textContent = "Generate a password first.";
                return;
            }

            try {
                await navigator.clipboard.writeText(password);
                message.textContent = "Password copied to clipboard.";
            } catch {
                message.textContent = "Clipboard access unavailable. Select and copy the password manually.";
            }
        });
    </script>
</body>
</html>
