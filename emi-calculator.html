
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .emi-container {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: #f5f6fa;
            border-radius: 14px;
        }
        .emi-container h1 {
            text-align: center;
            color: #101827;
        }
        .emi-container label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }
        .emi-container input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        .emi-container button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #101827;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .emi-result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            line-height: 1.9;
        }
        .emi-result h2 {
            color: #a17b18;
        }
        .emi-back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a17b18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="emi-container">
        <h1>EMI Calculator</h1>
        <p>Calculate your estimated monthly loan installment.</p>

        <form id="emiForm">
            <label for="loanAmount">Loan Amount (₹)</label>
            <input type="number" id="loanAmount" min="1" step="1" placeholder="Example: 500000" required>

            <label for="interestRate">Annual Interest Rate (%)</label>
            <input type="number" id="interestRate" min="0" step="0.01" placeholder="Example: 8.5" required>

            <label for="loanTenure">Loan Tenure (Years)</label>
            <input type="number" id="loanTenure" min="1" max="50" step="1" placeholder="Example: 5" required>

            <button type="submit">Calculate EMI</button>
        </form>

        <section class="emi-result" id="emiResult" aria-live="polite">
            <h2>Loan Summary</h2>
            <p id="monthlyEmi"></p>
            <p id="totalInterest"></p>
            <p id="totalPayment"></p>
        </section>

        <a href="index.html" class="emi-back">← Back to Home</a>
    </main>

    <script>
        const currency = new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        });

        document.getElementById("emiForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const principal = Number(document.getElementById("loanAmount").value);
            const annualRate = Number(document.getElementById("interestRate").value);
            const years = Number(document.getElementById("loanTenure").value);

            if (principal <= 0 || annualRate < 0 || years <= 0 || years > 50) {
                alert("Please enter valid loan details.");
                return;
            }

            const monthlyRate = annualRate / 12 / 100;
            const months = years * 12;

            const emi = monthlyRate === 0
                ? principal / months
                : principal * monthlyRate * Math.pow(1 + monthlyRate, months) /
                  (Math.pow(1 + monthlyRate, months) - 1);

            const totalPayment = emi * months;
            const interest = totalPayment - principal;

            document.getElementById("monthlyEmi").textContent =
                "Monthly EMI: " + currency.format(emi);

            document.getElementById("totalInterest").textContent =
                "Total Interest: " + currency.format(interest);

            document.getElementById("totalPayment").textContent =
                "Total Payment: " + currency.format(totalPayment);

            document.getElementById("emiResult").style.display = "block";
        });
    </script>
</body>
</html>
