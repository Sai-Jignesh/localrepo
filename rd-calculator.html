
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recurring Deposit Calculator | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .rd-container {
            max-width: 650px;
            margin: 45px auto;
            padding: 30px;
            background: #f5f6fa;
            border-radius: 14px;
        }
        h1 { text-align: center; color: #101827; }
        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #101827;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            background: white;
            border-radius: 10px;
            line-height: 1.9;
        }
        .result h2 { color: #a17b18; }
        .note { color: #666; font-size: 13px; }
        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a17b18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="rd-container">
        <h1>Recurring Deposit Calculator</h1>
        <p>Estimate your maturity amount by investing a fixed sum every month.</p>

        <form id="rdForm">
            <label for="monthlyDeposit">Monthly Deposit (₹)</label>
            <input type="number" id="monthlyDeposit" min="1" step="0.01" required>

            <label for="annualRate">Annual Interest Rate (%)</label>
            <input type="number" id="annualRate" min="0" max="100" step="0.01" value="7" required>

            <label for="tenure">Deposit Period (Months)</label>
            <input type="number" id="tenure" min="1" max="120" step="1" required>

            <button type="submit">Calculate Maturity</button>
        </form>

        <section class="result" id="result" aria-live="polite">
            <h2>Recurring Deposit Summary</h2>
            <p id="totalDeposit"></p>
            <p id="estimatedInterest"></p>
            <p id="maturityAmount"></p>
        </section>

        <p class="note">
            Illustrative estimate using monthly deposits and monthly compounding.
            Actual bank RD calculations and payout rules may differ.
        </p>

        <a href="index.html" class="back">← Back to Home</a>
    </main>

    <script>
        const money = new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        });

        document.getElementById("rdForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const monthlyDeposit = Number(document.getElementById("monthlyDeposit").value);
            const annualRate = Number(document.getElementById("annualRate").value);
            const months = Number(document.getElementById("tenure").value);

            if (
                monthlyDeposit <= 0 ||
                annualRate < 0 || annualRate > 100 ||
                months < 1 || months > 120
            ) {
                alert("Please enter valid deposit details.");
                return;
            }

            const monthlyRate = annualRate / 1200;

            const maturity = monthlyRate === 0
                ? monthlyDeposit * months
                : monthlyDeposit *
                  ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);

            const totalDeposit = monthlyDeposit * months;
            const interest = maturity - totalDeposit;

            document.getElementById("totalDeposit").textContent =
                "Total Deposits: " + money.format(totalDeposit);

            document.getElementById("estimatedInterest").textContent =
                "Estimated Interest: " + money.format(interest);

            document.getElementById("maturityAmount").textContent =
                "Estimated Maturity Amount: " + money.format(maturity);

            document.getElementById("result").style.display = "block";
        });
    </script>
</body>
</html>
