
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Planner | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .retirement-container {
            max-width: 700px;
            margin: 45px auto;
            padding: 30px;
            background: #f5f6fa;
            border-radius: 14px;
        }
        h1 { text-align: center; color: #101827; }
        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #101827;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            background: white;
            border-radius: 10px;
            line-height: 1.9;
        }
        .result h2 { color: #a17b18; }
        .note {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }
        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a17b18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="retirement-container">
        <h1>Retirement Planner</h1>
        <p>Estimate your retirement savings requirements and monthly investments.</p>

        <form id="retirementForm">
            <label for="currentAge">Current Age</label>
            <input type="number" id="currentAge" min="18" max="99" required>

            <label for="retirementAge">Planned Retirement Age</label>
            <input type="number" id="retirementAge" min="19" max="100" required>

            <label for="monthlyExpense">Current Monthly Expenses (₹)</label>
            <input type="number" id="monthlyExpense" min="1" step="0.01" required>

            <label for="inflation">Expected Annual Inflation (%)</label>
            <input type="number" id="inflation" min="0" max="30" step="0.1" value="6" required>

            <label for="returnRate">Expected Annual Investment Return (%)</label>
            <input type="number" id="returnRate" min="0" max="30" step="0.1" value="10" required>

            <label for="existingSavings">Existing Retirement Savings (₹)</label>
            <input type="number" id="existingSavings" min="0" step="0.01" value="0" required>

            <button type="submit">Calculate Retirement Plan</button>
        </form>

        <section class="result" id="result" aria-live="polite">
            <h2>Your Retirement Estimate</h2>
            <p id="retirementYears"></p>
            <p id="futureExpense"></p>
            <p id="retirementCorpus"></p>
            <p id="monthlyInvestment"></p>
            <p id="existingValue"></p>
        </section>

        <p class="note">
            This is an illustrative projection assuming constant inflation and investment returns.
            It does not account for taxes, fees or changing market conditions.
        </p>

        <a href="index.html" class="back">← Back to Home</a>
    </main>

    <script>
        const money = new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        });

        document.getElementById("retirementForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const currentAge = Number(document.getElementById("currentAge").value);
            const retirementAge = Number(document.getElementById("retirementAge").value);
            const monthlyExpense = Number(document.getElementById("monthlyExpense").value);
            const inflation = Number(document.getElementById("inflation").value) / 100;
            const returnRate = Number(document.getElementById("returnRate").value) / 100;
            const existingSavings = Number(document.getElementById("existingSavings").value);

            if (
                retirementAge <= currentAge ||
                monthlyExpense <= 0 ||
                inflation < 0 || inflation > 0.30 ||
                returnRate < 0 || returnRate > 0.30 ||
                existingSavings < 0
            ) {
                alert("Please enter valid retirement planning details.");
                return;
            }

            const years = retirementAge - currentAge;
            const months = years * 12;

            const futureMonthlyExpense =
                monthlyExpense * Math.pow(1 + inflation, years);

            // Illustrative corpus: 25 years of expenses, with 6% annual growth.
            const retirementCorpus =
                futureMonthlyExpense * 12 *
                (1 - Math.pow(1.06, -25)) / 0.06;

            const monthlyRate = Math.pow(1 + returnRate, 1 / 12) - 1;
            const existingValue = existingSavings *
                Math.pow(1 + monthlyRate, months);

            const remainingCorpus = Math.max(0, retirementCorpus - existingValue);

            const monthlyInvestment = monthlyRate === 0
                ? remainingCorpus / months
                : remainingCorpus * monthlyRate /
                  (Math.pow(1 + monthlyRate, months) - 1);

            document.getElementById("retirementYears").textContent =
                "Years Until Retirement: " + years;

            document.getElementById("futureExpense").textContent =
                "Estimated Monthly Expense at Retirement: " +
                money.format(futureMonthlyExpense);

            document.getElementById("retirementCorpus").textContent =
                "Estimated Retirement Corpus: " + money.format(retirementCorpus);

            document.getElementById("monthlyInvestment").textContent =
                "Suggested Monthly Investment: " + money.format(monthlyInvestment);

            document.getElementById("existingValue").textContent =
                "Future Value of Existing Savings: " + money.format(existingValue);

            document.getElementById("result").style.display = "block";
        });
    </script>
</body>
</html>
