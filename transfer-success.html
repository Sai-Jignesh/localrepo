
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Confirmation | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-container">
        <h1>Transfer Review</h1>
        <p>Verify your transfer before confirming.</p>

        <div id="transfer-details"></div>

        <button type="button" id="confirm-transfer">Confirm Demo Transfer</button>
        <p id="transfer-message" role="status"></p>

        <a href="transfer.html">Back to Transfer</a>
        <br><br>
        <a href="dashboard.html">Back to Dashboard</a>
    </div>

    <script>
        const details = document.getElementById("transfer-details");
        const confirmButton = document.getElementById("confirm-transfer");
        const message = document.getElementById("transfer-message");

        const transfer = JSON.parse(
            sessionStorage.getItem("novaTransferReview") || "null"
        );

        if (!transfer) {
            details.textContent = "No transfer details found. Please start again.";
            confirmButton.disabled = true;
        } else {
            const fields = [
                ["Recipient", transfer.recipient],
                ["Account Number", "••••" + transfer.account.slice(-4)],
                ["Amount", "₹" + transfer.amount.toFixed(2)],
                ["Description", transfer.description || "Not provided"]
            ];

            fields.forEach(([label, value]) => {
                const row = document.createElement("p");
                const strong = document.createElement("strong");
                strong.textContent = label + ": ";
                row.append(strong, document.createTextNode(value));
                details.appendChild(row);
            });
        }

        confirmButton.addEventListener("click", function () {
            if (!transfer) return;

            const records = JSON.parse(
                localStorage.getItem("novaDemoTransfers") || "[]"
            );

            records.push({
                ...transfer,
                reference: "NOVA" + Date.now(),
                date: new Date().toISOString(),
                status: "Demo Confirmed"
            });

            localStorage.setItem("novaDemoTransfers", JSON.stringify(records));
            sessionStorage.removeItem("novaTransferReview");

            message.textContent =
                "Demo transfer recorded successfully. No real money was transferred.";

            confirmButton.disabled = true;
        });
    </script>
</body>
</html>
