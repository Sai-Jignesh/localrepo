
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Transaction History</h1>
            <p>Search and manage your recent demo transactions.</p>

            <div class="transaction-controls">
                <input type="text" id="search-input" placeholder="Search transactions">
                <select id="type-filter">
                    <option value="all">All transactions</option>
                    <option value="credit">Credits</option>
                    <option value="debit">Debits</option>
                </select>
                <select id="sort-order">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                </select>
                <button type="button" id="clear-filters">Clear Filters</button>
            </div>

            <p id="transaction-count"></p>
            <div id="transaction-list"></div>
            <div id="transaction-details" class="transaction-details" hidden></div>

            <button type="button" id="download-csv">Download CSV</button>
            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </section>
    </main>

    <script>
        const transactions = [
            { date: "2026-11-10", description: "Salary Credit", category: "Income", type: "credit", amount: 75000, reference: "NOVA1001", status: "Successful" },
            { date: "2026-11-09", description: "Grocery Shopping", category: "Shopping", type: "debit", amount: 2500, reference: "NOVA1002", status: "Successful" },
            { date: "2026-11-08", description: "Electricity Bill", category: "Bills", type: "debit", amount: 1800, reference: "NOVA1003", status: "Successful" },
            { date: "2026-11-07", description: "Freelance Payment", category: "Income", type: "credit", amount: 12000, reference: "NOVA1004", status: "Successful" },
            { date: "2026-11-06", description: "Restaurant Payment", category: "Food", type: "debit", amount: 950, reference: "NOVA1005", status: "Successful" }
        ];

        const searchInput = document.getElementById("search-input");
        const typeFilter = document.getElementById("type-filter");
        const sortOrder = document.getElementById("sort-order");
        const transactionList = document.getElementById("transaction-list");
        const transactionCount = document.getElementById("transaction-count");
        const details = document.getElementById("transaction-details");

        const currency = amount => new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        }).format(amount);

        function updateTransactions() {
            const search = searchInput.value.toLowerCase();
            const type = typeFilter.value;

            let filtered = transactions.filter(transaction => {
                const matchesSearch =
                    transaction.description.toLowerCase().includes(search) ||
                    transaction.category.toLowerCase().includes(search) ||
                    transaction.reference.toLowerCase().includes(search);

                return matchesSearch && (type === "all" || transaction.type === type);
            });

            filtered.sort((a, b) => sortOrder.value === "newest"
                ? new Date(b.date) - new Date(a.date)
                : new Date(a.date) - new Date(b.date));

            transactionCount.textContent =
                `Showing ${filtered.length} of ${transactions.length} transactions`;

            transactionList.innerHTML = "";

            if (filtered.length === 0) {
                transactionList.textContent = "No transactions found.";
                return;
            }

            filtered.forEach(transaction => {
                const item = document.createElement("article");
                item.className = "transaction-item";
                item.innerHTML = `
                    <h3>${transaction.description}</h3>
                    <p>${transaction.date} | ${transaction.category}</p>
                    <p>${transaction.type.toUpperCase()} — ${currency(transaction.amount)}</p>
                    <p>Reference: ${transaction.reference}</p>
                    <span class="transaction-status">${transaction.status}</span>
                    <button type="button">View Details</button>
                `;

                item.querySelector("button").addEventListener("click", () => {
                    details.hidden = false;
                    details.textContent =
                        `${transaction.description} | ${transaction.date} | ${currency(transaction.amount)} | ${transaction.reference} | ${transaction.status}`;
                });

                transactionList.appendChild(item);
            });
        }

        searchInput.addEventListener("input", updateTransactions);
        typeFilter.addEventListener("change", updateTransactions);
        sortOrder.addEventListener("change", updateTransactions);

        document.getElementById("clear-filters").addEventListener("click", () => {
            searchInput.value = "";
            typeFilter.value = "all";
            sortOrder.value = "newest";
            details.hidden = true;
            updateTransactions();
        });

        document.getElementById("download-csv").addEventListener("click", () => {
            const rows = [
                ["Date", "Description", "Category", "Type", "Amount", "Reference", "Status"],
                ...transactions.map(t => [
                    t.date, t.description, t.category, t.type, t.amount, t.reference, t.status
                ])
            ];

            const csv = rows.map(row =>
                row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")
            ).join("\n");

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "nova-transactions.csv";
            link.click();
            URL.revokeObjectURL(url);
        });

        updateTransactions();
    </script>
</body>
</html>
