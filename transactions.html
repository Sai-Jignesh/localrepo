
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Transaction History</h1>
            <p>Search and manage your recent demo transactions.</p>

            <div class="transaction-summary">
                <p>Total Credits: <strong id="total-credits"></strong></p>
                <p>Total Debits: <strong id="total-debits"></strong></p>
                <p>Net Amount: <strong id="net-amount"></strong></p>
            </div>

            <div class="transaction-controls">
                <input type="search" id="search-input" placeholder="Search transactions">

                <select id="type-filter">
                    <option value="all">All transactions</option>
                    <option value="credit">Credits</option>
                    <option value="debit">Debits</option>
                </select>

                <select id="sort-order">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                </select>

                <label for="start-date">From date</label>
                <input type="date" id="start-date">

                <label for="end-date">To date</label>
                <input type="date" id="end-date">

                <button type="button" id="clear-filters">Clear Filters</button>
            </div>

            <p id="date-message" role="status"></p>
            <p id="transaction-count"></p>
            <div id="transaction-list"></div>
            <div id="transaction-details" hidden></div>

            <button type="button" id="download-csv">Download CSV</button>
            <button type="button" id="print-statement">Print Statement</button>

            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </section>
    </main>

    <script>
        const transactions = [
            { date: "2026-11-10", description: "Salary Credit", category: "Income", type: "credit", amount: 75000, reference: "NOVA1001", status: "Successful" },
            { date: "2026-11-09", description: "Grocery Shopping", category: "Shopping", type: "debit", amount: 2500, reference: "NOVA1002", status: "Successful" },
            { date: "2026-11-08", description: "Electricity Bill", category: "Bills", type: "debit", amount: 1800, reference: "NOVA1003", status: "Successful" },
            { date: "2026-11-07", description: "Freelance Payment", category: "Income", type: "credit", amount: 12000, reference: "NOVA1004", status: "Successful" },
            { date: "2026-11-06", description: "Restaurant Payment", category: "Food", type: "debit", amount: 950, reference: "NOVA1005", status: "Successful" }
        ];

        const $ = id => document.getElementById(id);

        const currency = amount => new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR"
        }).format(amount);

        function updateSummary() {
            const credits = transactions
                .filter(t => t.type === "credit")
                .reduce((sum, t) => sum + t.amount, 0);

            const debits = transactions
                .filter(t => t.type === "debit")
                .reduce((sum, t) => sum + t.amount, 0);

            $("total-credits").textContent = currency(credits);
            $("total-debits").textContent = currency(debits);
            $("net-amount").textContent = currency(credits - debits);
        }

        function getFilteredTransactions() {
            const search = $("search-input").value.toLowerCase();
            const type = $("type-filter").value;
            const start = $("start-date").value;
            const end = $("end-date").value;

            return transactions.filter(t => {
                const matchesSearch =
                    t.description.toLowerCase().includes(search) ||
                    t.category.toLowerCase().includes(search) ||
                    t.reference.toLowerCase().includes(search);

                const matchesType = type === "all" || t.type === type;
                const matchesStart = !start || t.date >= start;
                const matchesEnd = !end || t.date <= end;

                return matchesSearch && matchesType && matchesStart && matchesEnd;
            }).sort((a, b) => $("sort-order").value === "newest"
                ? new Date(b.date) - new Date(a.date)
                : new Date(a.date) - new Date(b.date));
        }

        function updateTransactions() {
            const start = $("start-date").value;
            const end = $("end-date").value;
            const dateMessage = $("date-message");

            if (start && end && start > end) {
                dateMessage.textContent = "The start date cannot be after the end date.";
                $("transaction-list").textContent = "";
                $("transaction-count").textContent = "0 transactions";
                return;
            }

            dateMessage.textContent = "";

            const filtered = getFilteredTransactions();
            $("transaction-count").textContent =
                `Showing ${filtered.length} of ${transactions.length} transactions`;

            $("transaction-list").innerHTML = "";
            $("transaction-details").hidden = true;

            if (!filtered.length) {
                $("transaction-list").textContent = "No matching transactions found.";
                return;
            }

            filtered.forEach(t => {
                const item = document.createElement("article");
                item.className = "transaction-item";

                const heading = document.createElement("h3");
                heading.textContent = t.description;

                const date = document.createElement("p");
                date.textContent = `${t.date} | ${t.category}`;

                const amount = document.createElement("p");
                amount.textContent = `${t.type.toUpperCase()} — ${currency(t.amount)}`;

                const reference = document.createElement("p");
                reference.textContent = `Reference: ${t.reference}`;

                const status = document.createElement("p");
                status.textContent = t.status;
                status.className = "transaction-status";

                const button = document.createElement("button");
                button.type = "button";
                button.textContent = "View Details";

                button.addEventListener("click", () => {
                    $("transaction-details").hidden = false;
                    $("transaction-details").textContent =
                        `${t.description} | ${t.date} | ${currency(t.amount)} | ${t.reference} | ${t.status}`;
                });

                item.append(heading, date, amount, reference, status, button);
                $("transaction-list").appendChild(item);
            });
        }

        ["search-input", "type-filter", "sort-order", "start-date", "end-date"]
            .forEach(id => $(id).addEventListener("input", updateTransactions));

        $("clear-filters").addEventListener("click", () => {
            $("search-input").value = "";
            $("type-filter").value = "all";
            $("sort-order").value = "newest";
            $("start-date").value = "";
            $("end-date").value = "";
            updateTransactions();
        });

        $("download-csv").addEventListener("click", () => {
            const rows = [
                ["Date", "Description", "Category", "Type", "Amount", "Reference", "Status"],
                ...getFilteredTransactions().map(t =>
                    [t.date, t.description, t.category, t.type, t.amount, t.reference, t.status]
                )
            ];

            const csv = rows.map(row =>
                row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")
            ).join("\n");

            const url = URL.createObjectURL(
                new Blob([csv], { type: "text/csv;charset=utf-8;" })
            );

            const link = document.createElement("a");
            link.href = url;
            link.download = "nova-transactions.csv";
            link.click();
            URL.revokeObjectURL(url);
        });

        $("print-statement").addEventListener("click", () => window.print());

        updateSummary();
        updateTransactions();
    </script>
</body>
</html>
