
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .budget-container {
            max-width: 750px;
            margin: 45px auto;
            padding: 30px;
            background: #f5f6fa;
            border-radius: 14px;
        }
        .budget-container h1 {
            text-align: center;
            color: #101827;
        }
        .budget-form label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }
        .budget-form input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        .budget-form button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #101827;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        .budget-summary {
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            line-height: 1.9;
        }
        .budget-summary h2 {
            color: #a17b18;
        }
        .budget-back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a17b18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="budget-container">
        <h1>Monthly Budget Planner</h1>
        <p>Plan your monthly income and track your expenses.</p>

        <form class="budget-form" id="budgetForm">
            <label for="income">Monthly Income (₹)</label>
            <input type="number" id="income" min="0" step="0.01" placeholder="Enter monthly income" required>

            <label for="housing">Housing (₹)</label>
            <input type="number" id="housing" min="0" step="0.01" value="0" required>

            <label for="food">Food and Groceries (₹)</label>
            <input type="number" id="food" min="0" step="0.01" value="0" required>

            <label for="transport">Transportation (₹)</label>
            <input type="number" id="transport" min="0" step="0.01" value="0" required>

            <label for="utilities">Utilities and Bills (₹)</label>
            <input type="number" id="utilities" min="0" step="0.01" value="0" required>

            <label for="other">Other Expenses (₹)</label>
            <input type="number" id="other" min="0" step="0.01" value="0" required>

            <button type="submit">Calculate Budget</button>
        </form>

        <section class="budget-summary" id="budgetSummary" aria-live="polite" hidden>
            <h2>Monthly Budget Summary</h2>
            <p id="totalIncome"></p>
            <p id="totalExpenses"></p>
            <p id="remainingBalance"></p>
            <p id="budgetStatus"></p>
        </section>

        <a href="index.html" class="budget-back">← Back to Home</a>
    </main>

    <script>
        const budgetCurrency = new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        });

        document.getElementById("budgetForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const income = Number(document.getElementById("income").value);
            const categories = ["housing", "food", "transport", "utilities", "other"];

            const expenses = categories.reduce((total, category) => {
                return total + Number(document.getElementById(category).value);
            }, 0);

            if (income < 0 || categories.some(category =>
                Number(document.getElementById(category).value) < 0
            )) {
                alert("Please enter valid non-negative amounts.");
                return;
            }

            const balance = income - expenses;

            document.getElementById("totalIncome").textContent =
                "Monthly Income: " + budgetCurrency.format(income);

            document.getElementById("totalExpenses").textContent =
                "Total Expenses: " + budgetCurrency.format(expenses);

            document.getElementById("remainingBalance").textContent =
                "Remaining Balance: " + budgetCurrency.format(balance);

            document.getElementById("budgetStatus").textContent =
                balance >= 0
                    ? "You are within your monthly budget."
                    : "Your expenses exceed your monthly income.";

            document.getElementById("budgetSummary").hidden = false;

            localStorage.setItem("novaMonthlyBudget", JSON.stringify({
                income,
                expenses,
                balance
            }));
        });
    </script>
</body>
</html>
