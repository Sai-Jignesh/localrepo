
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .expense-container {
            max-width: 750px;
            margin: 45px auto;
            padding: 30px;
            background: #f5f6fa;
            border-radius: 14px;
        }
        h1 { text-align: center; color: #101827; }
        .expense-form label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }
        .expense-form input,
        .expense-form select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        .expense-form button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #101827;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
        .expense-summary {
            margin: 25px 0;
            padding: 20px;
            background: white;
            border-radius: 10px;
            line-height: 1.8;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px;
            margin: 10px 0;
            background: white;
            border-radius: 8px;
        }
        .expense-item button {
            padding: 7px 12px;
            background: #a83232;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
        .expense-back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a17b18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="expense-container">
        <h1>Expense Tracker</h1>
        <p>Record and manage your daily expenses.</p>

        <form class="expense-form" id="expenseForm">
            <label for="expenseTitle">Expense Description</label>
            <input type="text" id="expenseTitle" maxlength="60" placeholder="Example: Grocery Shopping" required>

            <label for="expenseAmount">Amount (₹)</label>
            <input type="number" id="expenseAmount" min="0.01" step="0.01" required>

            <label for="expenseCategory">Category</label>
            <select id="expenseCategory" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <label for="expenseDate">Date</label>
            <input type="date" id="expenseDate" required>

            <button type="submit">Add Expense</button>
        </form>

        <section class="expense-summary">
            <h2>Expense Summary</h2>
            <p id="expenseCount">Total Records: 0</p>
            <p id="expenseTotal">Total Expenses: ₹0.00</p>
        </section>

        <h2>Recent Expenses</h2>
        <section id="expenseList" aria-live="polite"></section>

        <a href="index.html" class="expense-back">← Back to Home</a>
    </main>

    <script>
        const money = new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
        });

        let expenses = [];

        try {
            const stored = JSON.parse(localStorage.getItem("novaExpenses") || "[]");
            if (Array.isArray(stored)) {
                expenses = stored.filter(item =>
                    item &&
                    typeof item.title === "string" &&
                    typeof item.category === "string" &&
                    typeof item.date === "string" &&
                    Number.isFinite(item.amount) &&
                    item.amount > 0 &&
                    Number.isSafeInteger(item.id)
                );
            }
        } catch {
            expenses = [];
        }

        function saveExpenses() {
            localStorage.setItem("novaExpenses", JSON.stringify(expenses));
        }

        function renderExpenses() {
            const list = document.getElementById("expenseList");
            list.replaceChildren();

            const total = expenses.reduce((sum, item) => sum + item.amount, 0);

            document.getElementById("expenseCount").textContent =
                "Total Records: " + expenses.length;

            document.getElementById("expenseTotal").textContent =
                "Total Expenses: " + money.format(total);

            if (expenses.length === 0) {
                const message = document.createElement("p");
                message.textContent = "No expenses recorded yet.";
                list.appendChild(message);
                return;
            }

            [...expenses].reverse().forEach(item => {
                const card = document.createElement("article");
                card.className = "expense-item";

                const details = document.createElement("div");
                const title = document.createElement("strong");
                title.textContent = item.title;

                const info = document.createElement("p");
                info.textContent = item.category + " | " + item.date +
                    " | " + money.format(item.amount);

                details.append(title, info);

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.textContent = "Delete";
                removeButton.setAttribute("aria-label", "Delete " + item.title);

                removeButton.addEventListener("click", function() {
                    expenses = expenses.filter(expense => expense.id !== item.id);
                    saveExpenses();
                    renderExpenses();
                });

                card.append(details, removeButton);
                list.appendChild(card);
            });
        }

        document.getElementById("expenseDate").value =
            new Date().toISOString().slice(0, 10);

        document.getElementById("expenseForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const title = document.getElementById("expenseTitle").value.trim();
            const amount = Number(document.getElementById("expenseAmount").value);
            const category = document.getElementById("expenseCategory").value;
            const date = document.getElementById("expenseDate").value;

            if (!title || !Number.isFinite(amount) || amount <= 0 || !date) {
                alert("Please enter valid expense details.");
                return;
            }

            expenses.push({
                id: Date.now(),
                title,
                amount,
                category,
                date
            });

            saveExpenses();
            renderExpenses();
            this.reset();

            document.getElementById("expenseDate").value =
                new Date().toISOString().slice(0, 10);
        });

        renderExpenses();
    </script>
</body>
</html>
