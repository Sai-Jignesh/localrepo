
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Welcome Back</h1>
            <p>Sign in to your NOVA Bank demo account.</p>

            <form id="login-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" id="toggle-password">Show</button>
                </div>

                <label>
                    <input type="checkbox" id="remember-me">
                    Remember me
                </label>

                <p><a href="forgot-password.html">Forgot Password?</a></p>

                <button type="submit">Login</button>
            </form>

            <p id="login-message" role="status"></p>
            <p>Don't have an account? <a href="register.html">Register</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </section>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("toggle-password");

        toggleButton.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            toggleButton.textContent = isHidden ? "Hide" : "Show";
        });

        document.getElementById("login-form").addEventListener("submit", event => {
            event.preventDefault();

            document.getElementById("login-message").textContent =
                "Demo login submitted successfully. Authentication is not connected yet.";
        });
    </script>
</body>
</html>
