
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-container">
        <h1>Welcome Back</h1>
        <p>Login to your NOVA Bank account.</p>

        <form id="login-form">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" placeholder="Enter your password"
                       autocomplete="current-password" required>
                <button type="button" id="toggle-password">Show</button>
            </div>

            <div class="login-options">
                <label class="remember-option">
                    <input type="checkbox" id="remember-me">
                    Remember me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
        </form>

        <p id="login-message" role="status"></p>
        <p>Don't have an account? <a href="register.html">Register</a></p>
        <a href="index.html">Back to Home</a>
    </div>

    <script>
        const password = document.getElementById("password");
        const rememberMe = document.getElementById("remember-me");

        document.getElementById("toggle-password").addEventListener("click", function () {
            password.type = password.type === "password" ? "text" : "password";
            this.textContent = password.type === "password" ? "Show" : "Hide";
        });

        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            if (!this.reportValidity()) return;

            document.getElementById("login-message").textContent =
                rememberMe.checked
                ? "Remember me selected. Demo login only."
                : "Demo login submitted. No account was authenticated.";
        });
    </script>
</body>
</html>
