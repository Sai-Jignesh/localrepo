
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>NOVA Bank</h1>
            <p>Welcome to your banking dashboard.</p>

            <div class="dashboard-date">
                <p id="current-date"></p>
                <p id="current-time"></p>
            </div>

            <div class="balance-card">
                <h2>Available Balance</h2>
                <p id="account-balance">₹2,50,000.00</p>
                <button type="button" id="toggle-balance">Hide Balance</button>
            </div>

            <h2>Quick Actions</h2>
            <div class="dashboard-actions">
                <a href="transfer.html">Transfer Money</a>
                <a href="transactions.html">Transaction History</a>
                <a href="beneficiaries.html">Manage Beneficiaries</a>
                <a href="profile.html">My Profile</a>
                <a href="settings.html">Settings</a>
            </div>

            <button type="button" id="logout-button">Logout</button>
        </section>
    </main>

    <script>
        const balance = document.getElementById("account-balance");
        const toggleButton = document.getElementById("toggle-balance");
        const actualBalance = "₹2,50,000.00";
        let balanceVisible = true;

        toggleButton.addEventListener("click", () => {
            balanceVisible = !balanceVisible;
            balance.textContent = balanceVisible ? actualBalance : "••••••••";
            toggleButton.textContent = balanceVisible ? "Hide Balance" : "Show Balance";
        });

        function updateDateTime() {
            const now = new Date();

            document.getElementById("current-date").textContent =
                now.toLocaleDateString("en-IN", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });

            document.getElementById("current-time").textContent =
                now.toLocaleTimeString("en-IN");
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);

        document.getElementById("logout-button").addEventListener("click", () => {
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
