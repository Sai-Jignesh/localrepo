
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <style>
        .strength-track {
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        #strength-bar {
            width: 0;
            height: 100%;
            transition: width 0.25s ease;
        }

        #strength-text,
        #match-message {
            font-size: 14px;
        }

        .match-success {
            color: #198754;
        }

        .match-error {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Create Your Account</h1>
            <p>Register for a NOVA Bank demo account.</p>

            <form id="register-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" required minlength="2">

                <label for="email">Email Address</label>
                <input type="email" id="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required>

                <label for="password">Password</label>
                <input type="password" id="password" required minlength="8">

                <div class="strength-track">
                    <div id="strength-bar"></div>
                </div>
                <p id="strength-text" aria-live="polite">Password strength: Not entered</p>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required>
                <p id="match-message" aria-live="polite"></p>

                <p id="register-message" role="status"></p>

                <button type="submit">Create Account</button>
                <button type="reset">Clear Form</button>
            </form>

            <p>Already registered? <a href="login.html">Login</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </section>
    </main>

    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const strengthBar = document.getElementById("strength-bar");
        const strengthText = document.getElementById("strength-text");
        const matchMessage = document.getElementById("match-message");
        const registerMessage = document.getElementById("register-message");
        const form = document.getElementById("register-form");

        function checkStrength(value) {
            let score = 0;

            if (value.length >= 8) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[a-z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            const levels = [
                { label: "Very Weak", width: "10%", color: "#dc3545" },
                { label: "Weak", width: "25%", color: "#dc3545" },
                { label: "Fair", width: "45%", color: "#fd7e14" },
                { label: "Good", width: "65%", color: "#ffc107" },
                { label: "Strong", width: "85%", color: "#28a745" },
                { label: "Very Strong", width: "100%", color: "#198754" }
            ];

            const result = value.length === 0
                ? { label: "Not entered", width: "0%", color: "transparent" }
                : levels[score];

            strengthBar.style.width = result.width;
            strengthBar.style.background = result.color;
            strengthText.textContent = "Password strength: " + result.label;
        }

        function checkMatch() {
            if (!confirmPassword.value) {
                matchMessage.textContent = "";
                matchMessage.className = "";
                return false;
            }

            const matches = password.value === confirmPassword.value;

            matchMessage.textContent = matches
                ? "Passwords match."
                : "Passwords do not match.";

            matchMessage.className = matches ? "match-success" : "match-error";
            return matches;
        }

        password.addEventListener("input", () => {
            checkStrength(password.value);
            if (confirmPassword.value) checkMatch();
        });

        confirmPassword.addEventListener("input", checkMatch);

        form.addEventListener("submit", event => {
            event.preventDefault();

            if (password.value.length < 8) {
                registerMessage.textContent = "Password must contain at least 8 characters.";
                return;
            }

            if (!checkMatch()) {
                registerMessage.textContent = "Please make sure both passwords match.";
                return;
            }

            registerMessage.textContent =
                "Demo registration submitted successfully. Backend account creation is not connected.";
        });

        form.addEventListener("reset", () => {
            setTimeout(() => {
                checkStrength("");
                matchMessage.textContent = "";
                matchMessage.className = "";
                registerMessage.textContent = "";
            }, 0);
        });
    </script>
</body>
</html>
