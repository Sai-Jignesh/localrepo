
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-container">
        <h1>Create Account</h1>
        <p>Join NOVA Bank today.</p>

        <form id="register-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter 10-digit number" autocomplete="tel" pattern="[0-9]{10}" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                <button type="button" id="toggle-password">Show</button>
            </div>
            <small class="field-hint">Password must contain at least 8 characters.</small>

            <div class="strength-meter">
                <div id="strength-bar"></div>
            </div>
            <small id="password-strength" class="field-hint"></small>

            <label for="confirm-password">Confirm Password</label>
            <div class="password-field">
                <input type="password" id="confirm-password" placeholder="Confirm your password" autocomplete="new-password" required>
                <button type="button" id="toggle-confirm-password">Show</button>
            </div>
            <small id="password-match-message" class="field-hint"></small>

            <button type="submit">Create Account</button>
            <button type="reset" class="reset-button">Clear Form</button>
        </form>

        <div id="registration-success" class="success-message" role="status" hidden>
            Your registration form was submitted successfully!
        </div>

        <p>Already have an account? <a href="login.html">Login</a></p>
        <a href="index.html">Back to Home</a>
    </div>

    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const message = document.getElementById("password-match-message");
        const strengthMessage = document.getElementById("password-strength");
        const strengthBar = document.getElementById("strength-bar");
        const form = document.getElementById("register-form");
        const successMessage = document.getElementById("registration-success");

        function checkPasswordStrength() {
            const value = password.value;
            let score = 0;

            if (value.length >= 8) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[a-z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            strengthBar.style.width = (score * 20) + "%";

            if (!value) {
                strengthMessage.textContent = "";
                strengthBar.style.width = "0";
            } else if (score <= 2) {
                strengthMessage.textContent = "Password strength: Weak";
                strengthBar.style.backgroundColor = "#e74c3c";
            } else if (score <= 4) {
                strengthMessage.textContent = "Password strength: Medium";
                strengthBar.style.backgroundColor = "#f1c40f";
            } else {
                strengthMessage.textContent = "Password strength: Strong";
                strengthBar.style.backgroundColor = "#2ecc71";
            }
        }

        function checkPasswordMatch() {
            if (!confirmPassword.value) {
                message.textContent = "";
                confirmPassword.setCustomValidity("");
            } else if (password.value === confirmPassword.value) {
                message.textContent = "Passwords match.";
                confirmPassword.setCustomValidity("");
            } else {
                message.textContent = "Passwords do not match.";
                confirmPassword.setCustomValidity("Passwords do not match.");
            }
        }

        password.addEventListener("input", () => {
            checkPasswordStrength();
            checkPasswordMatch();
        });

        confirmPassword.addEventListener("input", checkPasswordMatch);

        document.getElementById("toggle-password").addEventListener("click", function () {
            password.type = password.type === "password" ? "text" : "password";
            this.textContent = password.type === "password" ? "Show" : "Hide";
        });

        document.getElementById("toggle-confirm-password").addEventListener("click", function () {
            confirmPassword.type = confirmPassword.type === "password" ? "text" : "password";
            this.textContent = confirmPassword.type === "password" ? "Show" : "Hide";
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            checkPasswordMatch();

            if (!form.reportValidity()) return;

            successMessage.hidden = false;
            form.reset();
            checkPasswordStrength();
            checkPasswordMatch();
        });

        form.addEventListener("reset", function () {
            successMessage.hidden = true;
            setTimeout(() => {
                checkPasswordStrength();
                checkPasswordMatch();
                document.getElementById("toggle-password").textContent = "Show";
                document.getElementById("toggle-confirm-password").textContent = "Show";
                password.type = "password";
                confirmPassword.type = "password";
            }, 0);
        });
    </script>
</body>
</html>
