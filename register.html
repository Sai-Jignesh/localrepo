<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="login-container">
        <h1>NOVA<span>Bank</span></h1>
        <h2>Create Your Account</h2>
        <p>Join NOVA Bank today</p>

        <form id="register-form">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname"
                   placeholder="Enter your full name"
                   autocomplete="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email"
                   autocomplete="email" required>

            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your mobile number"
                   autocomplete="tel"
                   pattern="[0-9]{10}" required>

            <label for="password">Create Password</label>
            <input type="password" id="password"
                   placeholder="Minimum 8 characters"
                   autocomplete="new-password"
                   minlength="8" required>

            <small class="field-hint">
                Password must contain at least 8 characters.
            </small>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password"
                   placeholder="Confirm your password"
                   autocomplete="new-password" required>

            <small id="password-match-message" class="field-hint"></small>

            <button type="submit" class="login-submit">
                Create Account
            </button>
        </form>

        <p>Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html">Back to Home</a>
    </div>

    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const message = document.getElementById("password-match-message");

        function checkPasswordMatch() {
            if (!confirmPassword.value) {
                message.textContent = "";
                confirmPassword.setCustomValidity("");
                return;
            }

            if (password.value === confirmPassword.value) {
                message.textContent = "Passwords match.";
                confirmPassword.setCustomValidity("");
            } else {
                message.textContent = "Passwords do not match.";
                confirmPassword.setCustomValidity("Passwords do not match.");
            }
        }

        password.addEventListener("input", checkPasswordMatch);
        confirmPassword.addEventListener("input", checkPasswordMatch);

        document.getElementById("register-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                if (!this.reportValidity()) return;

                alert("Registration form validated! Backend integration will come later.");
            });
    </script>

</body>
</html>
