
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NOVA Bank</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="login-container">
        <h1>Create Account</h1>
        <p>Join NOVA Bank today.</p>

        <form id="register-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name"
                   autocomplete="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email"
                   autocomplete="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter 10-digit number"
                   autocomplete="tel" pattern="[0-9]{10}" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password"
                       placeholder="Create a password"
                       autocomplete="new-password"
                       minlength="8" required>
                <button type="button" id="toggle-password">Show</button>
            </div>
            <small class="field-hint">Password must contain at least 8 characters.</small>

            <label for="confirm-password">Confirm Password</label>
            <div class="password-field">
                <input type="password" id="confirm-password"
                       placeholder="Confirm your password"
                       autocomplete="new-password" required>
                <button type="button" id="toggle-confirm-password">Show</button>
            </div>
            <small id="password-match-message" class="field-hint"></small>

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account? <a href="login.html">Login</a></p>
        <a href="index.html">Back to Home</a>
    </div>

    <script>
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const message = document.getElementById("password-match-message");

        function checkPasswordMatch() {
            if (!confirmPassword.value) {
                message.textContent = "";
                confirmPassword.setCustomValidity("");
            } else if (password.value === confirmPassword.value) {
                message.textContent = "Passwords match.";
                confirmPassword.setCustomValidity("");
            } else {
                message.textContent = "Passwords do not match.";
                confirmPassword.setCustomValidity("Passwords do not match.");
            }
        }

        password.addEventListener("input", checkPasswordMatch);
        confirmPassword.addEventListener("input", checkPasswordMatch);

        document.getElementById("toggle-password").addEventListener("click", function () {
            password.type = password.type === "password" ? "text" : "password";
            this.textContent = password.type === "password" ? "Show" : "Hide";
        });

        document.getElementById("toggle-confirm-password").addEventListener("click", function () {
            confirmPassword.type = confirmPassword.type === "password" ? "text" : "password";
            this.textContent = confirmPassword.type === "password" ? "Show" : "Hide";
        });

        document.getElementById("register-form").addEventListener("submit", function (event) {
            event.preventDefault();
            checkPasswordMatch();

            if (!this.reportValidity()) return;

            alert("Registration form submitted successfully! (Demo only)");
        });
    </script>

</body>
</html>
